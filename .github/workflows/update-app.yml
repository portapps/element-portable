name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app # secrets are gated by this environment
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Element
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');

            const sourceUrl = 'https://packages.element.io/desktop/install/win32/x64/index.html';
            const artifactPattern = /^Element Setup (\d+\.\d+\.\d+)\.exe$/;

            function workspacePath(relativePath) {
              return path.join(process.env.GITHUB_WORKSPACE, relativePath);
            }

            function readFile(relativePath) {
              return fs.readFileSync(workspacePath(relativePath), 'utf8');
            }

            function writeFile(relativePath, content) {
              fs.writeFileSync(workspacePath(relativePath), content, 'utf8');
            }

            function propertyValue(content, name) {
              const pattern = new RegExp(`^${name.replaceAll('.', '\\.')}\\s*=\\s*(.+)$`, 'm');
              const match = content.match(pattern);
              if (!match) {
                throw new Error(`Missing ${name} in build.properties`);
              }
              return match[1].trim();
            }

            function replaceProperty(content, name, value) {
              const pattern = new RegExp(`^(${name.replaceAll('.', '\\.')}\\s*=\\s*).+$`, 'm');
              if (!pattern.test(content)) {
                throw new Error(`Missing ${name} in build.properties`);
              }
              return content.replace(pattern, (_, prefix) => `${prefix}${value}`);
            }

            function decodeHtml(value) {
              return value
                .replace(/&#x([0-9a-f]+);/gi, (_, code) => String.fromCodePoint(parseInt(code, 16)))
                .replace(/&#(\d+);/g, (_, code) => String.fromCodePoint(Number(code)))
                .replace(/&quot;/g, '"')
                .replace(/&#39;/g, "'")
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&amp;/g, '&');
            }

            function attributeValue(tag, name) {
              const pattern = new RegExp(`${name}\\s*=\\s*("([^"]*)"|'([^']*)'|([^\\s>]+))`, 'i');
              const match = tag.match(pattern);
              if (!match) {
                return null;
              }
              return decodeHtml(match[2] || match[3] || match[4]);
            }

            function basenameFromHref(href) {
              const pathname = new URL(href, sourceUrl).pathname;
              const basename = pathname.substring(pathname.lastIndexOf('/') + 1);
              try {
                return decodeURIComponent(basename);
              } catch {
                return basename;
              }
            }

            function versionParts(version) {
              if (!/^\d+(?:\.\d+)*$/.test(version)) {
                throw new Error(`Invalid version: ${version}`);
              }
              return version.split('.').map(Number);
            }

            function compareVersions(left, right) {
              const leftParts = versionParts(left);
              const rightParts = versionParts(right);
              for (let i = 0; i < Math.max(leftParts.length, rightParts.length); i++) {
                const diff = (leftParts[i] || 0) - (rightParts[i] || 0);
                if (diff !== 0) {
                  return diff;
                }
              }
              return 0;
            }

            function compareCandidates(left, right) {
              const versionDiff = compareVersions(left.version, right.version);
              if (versionDiff !== 0) {
                return versionDiff;
              }
              return left.archiveName.localeCompare(right.archiveName);
            }

            function candidateFromAnchor(tag) {
              const href = attributeValue(tag, 'href');
              const archiveName = attributeValue(tag, 'title') || (href ? basenameFromHref(href) : '');
              const match = artifactPattern.exec(archiveName);
              if (!match) {
                return null;
              }

              return {
                version: match[1],
                archiveName,
                downloadUrl: new URL(href || archiveName, sourceUrl).toString()
              };
            }

            async function latestStableInstaller() {
              const response = await fetch(sourceUrl, {
                headers: {
                  'accept': 'text/html',
                  'user-agent': 'portapps/element-portable update-app'
                }
              });
              if (!response.ok) {
                throw new Error(`Failed to fetch ${sourceUrl}: ${response.status} ${response.statusText}`);
              }

              const html = await response.text();
              const candidates = [...html.matchAll(/<a\b[^>]*>/gi)]
                .map((match) => candidateFromAnchor(match[0]))
                .filter(Boolean);
              if (candidates.length === 0) {
                throw new Error(`No stable Windows x64 Element installers found in ${sourceUrl}`);
              }
              candidates.sort(compareCandidates);
              return candidates.at(-1);
            }

            const latest = await latestStableInstaller();
            core.info(`Resolved latest stable Element installer: ${JSON.stringify(latest)}`);

            const relativePath = 'build.properties';
            const currentContent = readFile(relativePath);
            const currentVersion = propertyValue(currentContent, 'app.version');
            const currentRelease = Number(propertyValue(currentContent, 'app.release'));
            if (!Number.isInteger(currentRelease)) {
              throw new Error(`Invalid app.release in ${relativePath}: ${currentRelease}`);
            }

            let updatedContent = currentContent;
            updatedContent = replaceProperty(updatedContent, 'app.version', latest.version);
            const versionChanged = updatedContent !== currentContent;
            updatedContent = replaceProperty(updatedContent, 'atf.win64.url', 'https://packages.element.io/desktop/install/win32/x64/Element%20Setup%20${app.version}.exe');
            const nextRelease = versionChanged ? currentRelease + 1 : currentRelease;
            updatedContent = replaceProperty(updatedContent, 'app.release', String(nextRelease));

            if (updatedContent !== currentContent) {
              writeFile(relativePath, updatedContent);
              core.info(`Updated ${relativePath}`);
            } else {
              core.info(`${relativePath} is already up to date`);
            }

            core.setOutput('title', `Element ${latest.version}`);
            core.setOutput('version', latest.version);
            core.setOutput('previous-version', currentVersion);
            core.setOutput('release', String(nextRelease));
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-element
          token: ${{ steps.write-app.outputs.token }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates Element to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read # same as global permissions
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Element
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
